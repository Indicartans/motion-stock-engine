<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Retro Asterisk Motion Background - Tactile Risograph Texture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #010a05;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* ---------------------------------------------------------
       RESPONSIVE STAGE CONTAINER (Strict 1920x1080 canvas)
       Auto-scales proportionally in browser preview; 1.0 in render
       --------------------------------------------------------- */
    #stage-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.95);
      background: #010c06;
    }

    #motionCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }

    /* ---------------------------------------------------------
       MINIMALIST SLEEK HUD CONTROLS (Auto-hidden in render mode)
       --------------------------------------------------------- */
    #preview-controls {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(3, 16, 10, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(74, 222, 128, 0.3);
      border-radius: 9999px;
      padding: 8px 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 25px rgba(74, 222, 128, 0.15);
      z-index: 100;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s ease;
    }

    .hide-controls #preview-controls,
    .hide-controls #header-info {
      display: none !important;
    }

    .btn {
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #021a0d;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 9999px;
      padding: 7px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .btn:hover {
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.8);
      transform: scale(1.04);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: #86efac;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(74, 222, 128, 0.25);
      color: #ffffff;
    }

    .btn-secondary.active {
      background: #4ade80;
      color: #021a0d;
      font-weight: 700;
      border-color: #4ade80;
    }

    .slider {
      width: 200px;
      accent-color: #4ade80;
      cursor: pointer;
      height: 5px;
      border-radius: 3px;
    }

    .telemetry {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      color: #bbf7d0;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      font-family: 'Consolas', monospace;
      color: #86efac;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 3px 10px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(74, 222, 128, 0.25);
    }

    .theme-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Minimal Floating Header */
    #header-info {
      position: absolute;
      top: 26px;
      left: 32px;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.3s ease;
    }

    .project-pill {
      background: rgba(3, 16, 10, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #86efac;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseAnim 2s infinite ease-in-out;
    }

    @keyframes pulseAnim {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <!-- GSAP Local with CDN Fallback -->
  <script src="./node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    if (typeof gsap === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="stage-container">
    <canvas id="motionCanvas" width="1920" height="1080"></canvas>

    <!-- Header Info -->
    <div id="header-info">
      <div class="project-pill">
        <div class="pulse-dot"></div>
        RETRO MOTION STOCK • 1080P SEAMLESS LOOP
      </div>
      <div class="badge" id="themeBadge">THEME: EMERALD (REF)</div>
      <div class="badge" style="color: #cbd5e1; border-color: rgba(203, 213, 225, 0.25);">PRESS 'H' TO HIDE HUD</div>
    </div>

    <!-- Minimalist Preview HUD -->
    <div id="preview-controls">
      <button id="playBtn" class="btn" title="Toggle Play / Pause (Spacebar)">
        <span id="playIcon">⏸</span> <span id="playText">PAUSE</span>
      </button>
      <input type="range" id="scrubber" class="slider" min="0" max="1" step="0.001" value="0">
      <div class="telemetry" id="timeInfo">0.00s / 10.00s</div>
      <div class="telemetry badge">FR: <span id="frameInfo">0</span>/300</div>

      <div class="divider"></div>

      <!-- Theme Switcher -->
      <div class="theme-group">
        <button class="btn-secondary active" data-theme="emerald" title="Reference Pinterest Look">Emerald</button>
        <button class="btn-secondary" data-theme="amber" title="70s Tangerine & Cream">Amber</button>
        <button class="btn-secondary" data-theme="cobalt" title="Y2K Cobalt Cyber">Cobalt</button>
        <button class="btn-secondary" data-theme="vapor" title="Acid Vapor Violet">Vapor</button>
      </div>

      <div class="divider"></div>

      <!-- Texture Intensity Switcher -->
      <button class="btn-secondary active" id="textureBtn" title="Toggle Texture Level">Texture: HEAVY</button>

      <!-- Arms Style Switcher -->
      <button class="btn-secondary" id="armsToggle" title="Toggle Asterisk Arm Count">Arms: 6+6</button>

      <!-- Creator Safe Zone Guide -->
      <button class="btn-secondary" id="guideToggle" title="Toggle 9:16 Reel Safe Zone">Guide: OFF</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Configuration & Specifications (Matching rules.md: 1080p, 30fps, 10s loop)
    // -------------------------------------------------------------
    const CONFIG = {
      width: 1920,
      height: 1080,
      duration: 10,       // 10 Seconds (5-15s requirement)
      fps: 30,            // 30 FPS
      totalFrames: 300    // 10s * 30fps = 300 frames
    };

    const stage = document.getElementById('stage-container');
    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const cx = CONFIG.width / 2;
    const cy = CONFIG.height / 2;

    // Responsive auto-fit scaling for browser window preview
    function updateStageScale() {
      const scale = Math.min(window.innerWidth / CONFIG.width, window.innerHeight / CONFIG.height);
      stage.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', updateStageScale);
    updateStageScale();

    // -------------------------------------------------------------
    // Curated Aesthetic Palettes (Rich Retro & Reusable)
    // -------------------------------------------------------------
    const THEMES = {
      emerald: {
        name: 'EMERALD (REF)',
        bgDark: '#010c06',
        bgMid: '#062617',
        bgGlow: '#0e452a',
        vignette: 'rgba(1, 10, 5, 0.78)',
        // Hero 1 (Upper-right: Creamy Mint / Pastel white-green)
        hero1: {
          fill: '#dafbe7',
          glow: 'rgba(187, 247, 208, 0.45)',
          shadow: 'rgba(1, 14, 8, 0.85)'
        },
        // Hero 2 (Lower-left: Vibrant Retro Sage / Chartreuse emerald)
        hero2: {
          fill: '#4ade80',
          glow: 'rgba(74, 222, 128, 0.45)',
          shadow: 'rgba(1, 14, 8, 0.9)'
        },
        hudAccent: '#4ade80'
      },
      amber: {
        name: 'VINTAGE AMBER & TANGERINE',
        bgDark: '#120702',
        bgMid: '#2d1205',
        bgGlow: '#562409',
        vignette: 'rgba(14, 5, 1, 0.8)',
        hero1: {
          fill: '#fef3c7',
          glow: 'rgba(253, 230, 138, 0.45)',
          shadow: 'rgba(18, 7, 2, 0.85)'
        },
        hero2: {
          fill: '#f97316',
          glow: 'rgba(249, 115, 22, 0.45)',
          shadow: 'rgba(18, 7, 2, 0.9)'
        },
        hudAccent: '#f97316'
      },
      cobalt: {
        name: 'Y2K COBALT CYBER',
        bgDark: '#020914',
        bgMid: '#071d3a',
        bgGlow: '#0e396a',
        vignette: 'rgba(1, 6, 14, 0.8)',
        hero1: {
          fill: '#e0f2fe',
          glow: 'rgba(186, 230, 253, 0.45)',
          shadow: 'rgba(2, 9, 20, 0.85)'
        },
        hero2: {
          fill: '#38bdf8',
          glow: 'rgba(56, 189, 248, 0.45)',
          shadow: 'rgba(2, 9, 20, 0.9)'
        },
        hudAccent: '#38bdf8'
      },
      vapor: {
        name: 'ACID VAPOR VIOLET',
        bgDark: '#0f0217',
        bgMid: '#27083a',
        bgGlow: '#4c0f70',
        vignette: 'rgba(12, 1, 18, 0.8)',
        hero1: {
          fill: '#fae8ff',
          glow: 'rgba(245, 208, 254, 0.45)',
          shadow: 'rgba(15, 2, 23, 0.85)'
        },
        hero2: {
          fill: '#f472b6',
          glow: 'rgba(244, 114, 182, 0.45)',
          shadow: 'rgba(15, 2, 23, 0.9)'
        },
        hudAccent: '#f472b6'
      }
    };

    let currentThemeKey = 'emerald';
    let textureLevel = 'HEAVY'; // 'HEAVY', 'MEDIUM', 'SUBTLE', 'OFF'
    let showGuideOverlay = false;
    let armsMode = '6+6'; // '6+6' (clean reference style), '8+6', '8+8'

    // -------------------------------------------------------------
    // Multi-Octave Tactile Risograph & Paper Grain Texture Engine
    // -------------------------------------------------------------
    const TEX_SIZE = 512;
    const textureCanvas = document.createElement('canvas');
    textureCanvas.width = TEX_SIZE;
    textureCanvas.height = TEX_SIZE;
    const texCtx = textureCanvas.getContext('2d');
    const texImgData = texCtx.createImageData(TEX_SIZE, TEX_SIZE);
    const texData = texImgData.data;

    let seed = 4242;
    function deterministicRandom() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }

    // Octave 1: Smooth paper tooth / mottling
    const gridS = 32;
    const gridW = Math.ceil(TEX_SIZE / gridS) + 1;
    const cellNoise = [];
    for (let i = 0; i < gridW * gridW; i++) {
      cellNoise.push(deterministicRandom());
    }

    for (let y = 0; y < TEX_SIZE; y++) {
      const gy = Math.floor(y / gridS);
      const fy = (y % gridS) / gridS;
      for (let x = 0; x < TEX_SIZE; x++) {
        const gx = Math.floor(x / gridS);
        const fx = (x % gridS) / gridS;

        const v00 = cellNoise[gy * gridW + gx];
        const v10 = cellNoise[gy * gridW + gx + 1];
        const v01 = cellNoise[(gy + 1) * gridW + gx];
        const v11 = cellNoise[(gy + 1) * gridW + gx + 1];

        // Smooth bilinear paper tooth
        const paperTooth = ((v00 * (1 - fx) + v10 * fx) * (1 - fy) + (v01 * (1 - fx) + v11 * fx) * fy) * 50 - 25;
        // Octave 2: Sharp risograph ink grit / stipple
        const inkGrit = (deterministicRandom() * 2 - 1) * 75;

        const val = Math.max(0, Math.min(255, 128 + paperTooth + inkGrit));
        const idx = (y * TEX_SIZE + x) * 4;
        texData[idx] = val;
        texData[idx + 1] = val;
        texData[idx + 2] = val;
        texData[idx + 3] = 255;
      }
    }
    texCtx.putImageData(texImgData, 0, 0);

    // -------------------------------------------------------------
    // Procedural Asterisk Geometry with Inherent Riso Print Texture
    // Clipped precisely to capsule paths without circular artifacts
    // -------------------------------------------------------------
    function drawRetroAsterisk(targetCtx, x, y, radius, armWidth, armsCount, rotation, fillStyle, options = {}) {
      targetCtx.save();
      targetCtx.translate(x, y);
      targetCtx.rotate(rotation);

      const numCapsules = armsCount / 2;
      const r = armWidth / 2;
      const halfLen = radius - r;

      // 1. Gritty drop shadow / glow pass
      if (options.shadowColor) {
        targetCtx.save();
        targetCtx.shadowColor = options.shadowColor;
        targetCtx.shadowBlur = options.shadowBlur || 38;
        targetCtx.shadowOffsetX = options.shadowOffsetX || 0;
        targetCtx.shadowOffsetY = options.shadowOffsetY || 18;
        targetCtx.fillStyle = fillStyle;

        for (let i = 0; i < numCapsules; i++) {
          targetCtx.save();
          targetCtx.rotate((i * Math.PI) / numCapsules);
          targetCtx.beginPath();
          targetCtx.arc(halfLen, 0, r, -Math.PI / 2, Math.PI / 2);
          targetCtx.arc(-halfLen, 0, r, Math.PI / 2, 1.5 * Math.PI);
          targetCtx.closePath();
          targetCtx.fill();
          targetCtx.restore();
        }
        targetCtx.restore();
      }

      // 2. Solid crisp body of the capsules
      targetCtx.fillStyle = fillStyle;
      for (let i = 0; i < numCapsules; i++) {
        targetCtx.save();
        targetCtx.rotate((i * Math.PI) / numCapsules);
        targetCtx.beginPath();
        targetCtx.arc(halfLen, 0, r, -Math.PI / 2, Math.PI / 2);
        targetCtx.arc(-halfLen, 0, r, Math.PI / 2, 1.5 * Math.PI);
        targetCtx.closePath();
        targetCtx.fill();
        targetCtx.restore();
      }

      // Center seal without shadow
      targetCtx.beginPath();
      targetCtx.arc(0, 0, r, 0, Math.PI * 2);
      targetCtx.fill();

      // 3. Tactile Print Texture ONLY on the capsule arms (using clip)
      if (textureLevel !== 'OFF') {
        targetCtx.save();
        // Construct clipping path of all capsules
        targetCtx.beginPath();
        for (let i = 0; i < numCapsules; i++) {
          targetCtx.save();
          targetCtx.rotate((i * Math.PI) / numCapsules);
          targetCtx.arc(halfLen, 0, r, -Math.PI / 2, Math.PI / 2);
          targetCtx.arc(-halfLen, 0, r, Math.PI / 2, 1.5 * Math.PI);
          targetCtx.closePath();
          targetCtx.restore();
        }
        targetCtx.arc(0, 0, r, 0, Math.PI * 2);
        targetCtx.clip();

        let texAlpha = 0.28;
        if (textureLevel === 'MEDIUM') texAlpha = 0.18;
        if (textureLevel === 'SUBTLE') texAlpha = 0.10;

        targetCtx.globalAlpha = texAlpha;
        const pat = targetCtx.createPattern(textureCanvas, 'repeat');
        targetCtx.fillStyle = pat;
        targetCtx.fillRect(-radius, -radius, radius * 2, radius * 2);

        // Directional subtle paper sheen inside the clipped arms
        targetCtx.globalAlpha = 0.15;
        const sheen = targetCtx.createLinearGradient(-radius * 0.7, -radius * 0.7, radius * 0.7, radius * 0.7);
        sheen.addColorStop(0, '#ffffff');
        sheen.addColorStop(0.5, 'transparent');
        sheen.addColorStop(1, '#000000');
        targetCtx.fillStyle = sheen;
        targetCtx.fillRect(-radius, -radius, radius * 2, radius * 2);

        targetCtx.restore();
      }

      targetCtx.restore();
    }

    // -------------------------------------------------------------
    // MAIN RENDER SCENE (Simple, Bold, Heavy Texture, Seamless Loop)
    // Focused strictly on the 2 diagonal hero asterisks (Matching Pinterest reference)
    // -------------------------------------------------------------
    function renderScene(progress) {
      const theme = THEMES[currentThemeKey];
      const tau = Math.PI * 2;
      const t = progress; // 0.0 to 1.0

      // 1. Dynamic Background Mesh with Organic Falloff
      const lightX = cx + Math.sin(t * tau) * 160;
      const lightY = cy - 60 + Math.cos(t * tau) * 120;

      const bgGrad = ctx.createRadialGradient(lightX, lightY, 120, cx, cy, 1150);
      bgGrad.addColorStop(0, theme.bgGlow);
      bgGrad.addColorStop(0.5, theme.bgMid);
      bgGrad.addColorStop(1, theme.bgDark);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

      // Diagonal luminous accent flow
      const diagX = cx - Math.cos(t * tau) * 220;
      const diagY = cy + Math.sin(t * tau) * 180;
      const diagGrad = ctx.createRadialGradient(diagX, diagY, 50, diagX, diagY, 700);
      diagGrad.addColorStop(0, theme.hero2.glow);
      diagGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = diagGrad;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
      ctx.restore();

      // -----------------------------------------------------------
      // 2. HERO ASTERISKS PAIR (The iconic Pinterest reference composition!)
      // Interlocking diagonal composition with clean negative space:
      // Hero 1 (Upper Right: Creamy Mint Pastel)
      // Hero 2 (Lower Left: Vibrant Retro Sage Green)
      // -----------------------------------------------------------
      const hero1BaseX = 1140;
      const hero1BaseY = 410;
      const hero1X = hero1BaseX + Math.sin(t * tau) * 45;
      const hero1Y = hero1BaseY + Math.cos(t * tau) * 35;

      const hero2BaseX = 760;
      const hero2BaseY = 610;
      const hero2X = hero2BaseX - Math.cos(t * tau) * 45;
      const hero2Y = hero2BaseY + Math.sin(t * tau) * 35;

      // Glow halo behind Hero 2 (Smooth organic falloff to zero)
      const halo2 = ctx.createRadialGradient(hero2X, hero2Y, 40, hero2X, hero2Y, 520);
      halo2.addColorStop(0, theme.hero2.glow);
      halo2.addColorStop(0.3, theme.hero2.glow);
      halo2.addColorStop(0.7, 'rgba(0,0,0,0.05)');
      halo2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = halo2;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
      ctx.restore();

      // Glow halo behind Hero 1 (Smooth organic falloff to zero)
      const halo1 = ctx.createRadialGradient(hero1X, hero1Y, 30, hero1X, hero1Y, 480);
      halo1.addColorStop(0, theme.hero1.glow);
      halo1.addColorStop(0.3, theme.hero1.glow);
      halo1.addColorStop(0.7, 'rgba(0,0,0,0.05)');
      halo1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = halo1;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
      ctx.restore();

      // Determine arm counts (Default 6+6 matching Pinterest pin exactly)
      let hero1Arms = 6;
      let hero2Arms = 6;
      if (armsMode === '8+6') {
        hero1Arms = 8;
        hero2Arms = 6;
      } else if (armsMode === '8+8') {
        hero1Arms = 8;
        hero2Arms = 8;
      }

      // Hero 2 (Lower-Left Hero: Vibrant Retro Sage Green)
      // Radius: 340px, armWidth: 100px, 1 full counter-clockwise rotation per 10s
      const hero2Rot = -t * tau + Math.PI / 6;
      const hero2Scale = 1.0 + Math.cos(t * tau * 2) * 0.035;
      const hero2Radius = 340 * hero2Scale;
      const hero2ArmWidth = 100 * hero2Scale;

      drawRetroAsterisk(ctx, hero2X, hero2Y, hero2Radius, hero2ArmWidth, hero2Arms, hero2Rot, theme.hero2.fill, {
        glowColor: theme.hero2.glow,
        glowBlur: 45,
        shadowColor: theme.hero2.shadow,
        shadowBlur: 40,
        shadowOffsetX: -14,
        shadowOffsetY: 20
      });

      // Hero 1 (Upper-Right Hero: Creamy Pastel Mint White)
      // Radius: 290px, armWidth: 86px, 1 full clockwise rotation per 10s
      // Rich drop shadow cast over Hero 2 and the background
      const hero1Rot = t * tau;
      const hero1Scale = 1.0 + Math.sin(t * tau * 2) * 0.04;
      const hero1Radius = 290 * hero1Scale;
      const hero1ArmWidth = 86 * hero1Scale;

      drawRetroAsterisk(ctx, hero1X, hero1Y, hero1Radius, hero1ArmWidth, hero1Arms, hero1Rot, theme.hero1.fill, {
        glowColor: theme.hero1.glow,
        glowBlur: 50,
        shadowColor: theme.hero1.shadow,
        shadowBlur: 38,
        shadowOffsetX: -16,
        shadowOffsetY: 24
      });

      // 3. Vignette (Dark retro edges)
      const vigGrad = ctx.createRadialGradient(cx, cy, 540, cx, cy, 1080);
      vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
      vigGrad.addColorStop(0.65, 'rgba(0,0,0,0.25)');
      vigGrad.addColorStop(1, theme.vignette);
      ctx.fillStyle = vigGrad;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

      // -----------------------------------------------------------
      // 4. RICH RETRO RISOGRAPH & PAPER GRAIN OVERLAY
      // Seeded deterministically per frame for authentic 16mm / riso print flicker
      // -----------------------------------------------------------
      if (textureLevel !== 'OFF') {
        const frameIndex = Math.floor(t * (CONFIG.totalFrames - 1));
        const grainOffsetX = (frameIndex * 73) % TEX_SIZE;
        const grainOffsetY = (frameIndex * 137) % TEX_SIZE;
        const grainPattern = ctx.createPattern(textureCanvas, 'repeat');

        let overlayAlpha = 0.48;
        let softLightAlpha = 0.35;
        if (textureLevel === 'MEDIUM') {
          overlayAlpha = 0.32;
          softLightAlpha = 0.22;
        } else if (textureLevel === 'SUBTLE') {
          overlayAlpha = 0.18;
          softLightAlpha = 0.12;
        }

        // Pass A: Overlay for contrast and grit
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = overlayAlpha;
        ctx.translate(-grainOffsetX, -grainOffsetY);
        ctx.fillStyle = grainPattern;
        ctx.fillRect(grainOffsetX, grainOffsetY, CONFIG.width, CONFIG.height);
        ctx.restore();

        // Pass B: Soft-light for deep paper tooth integration
        ctx.save();
        ctx.globalCompositeOperation = 'soft-light';
        ctx.globalAlpha = softLightAlpha;
        ctx.translate(-grainOffsetX * 0.5, -grainOffsetY * 0.5);
        ctx.fillStyle = grainPattern;
        ctx.fillRect(grainOffsetX * 0.5, grainOffsetY * 0.5, CONFIG.width, CONFIG.height);
        ctx.restore();
      }

      // 5. Optional Creator Reusability Overlay Guides (9:16 Shorts / Reel & 16:9 Title Safe)
      if (showGuideOverlay) {
        ctx.save();
        // 9:16 Reel Safe Box in center (607.5px width x 1080px height)
        const reelW = (CONFIG.height * 9) / 16;
        const reelX = (CONFIG.width - reelW) / 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.strokeRect(reelX, 0, reelW, CONFIG.height);

        // 16:9 Title Safe (80%)
        const titleSafeW = CONFIG.width * 0.8;
        const titleSafeH = CONFIG.height * 0.8;
        ctx.strokeStyle = theme.hudAccent;
        ctx.strokeRect((CONFIG.width - titleSafeW) / 2, (CONFIG.height - titleSafeH) / 2, titleSafeW, titleSafeH);

        // Overlay Labels
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px monospace';
        ctx.fillText('9:16 REEL / SHORTS SAFE ZONE', reelX + 16, 44);
        ctx.fillText('16:9 TITLE SAFE (80%)', (CONFIG.width - titleSafeW) / 2 + 16, (CONFIG.height - titleSafeH) / 2 + 32);
        ctx.restore();
      }
    }

    // -------------------------------------------------------------
    // GSAP Timeline & Playback Engine
    // -------------------------------------------------------------
    const animState = { progress: 0 };

    const masterTimeline = gsap.timeline({
      duration: CONFIG.duration,
      repeat: -1,
      paused: false,
      ease: 'none'
    });

    masterTimeline.to(animState, {
      progress: 1,
      duration: CONFIG.duration,
      ease: 'none',
      onUpdate: () => {
        renderScene(animState.progress);
        updatePreviewHUD(animState.progress);
      }
    });

    // -------------------------------------------------------------
    // Global Deterministic API for Playwright (render.mjs)
    // -------------------------------------------------------------
    window.renderFrame = function(frameIndex, totalFrames) {
      if (!masterTimeline.paused()) {
        masterTimeline.pause();
        document.getElementById('stage-container').classList.add('hide-controls');
      }
      const total = totalFrames || CONFIG.totalFrames;
      const p = Math.max(0, Math.min(1, frameIndex / (total - 1)));
      animState.progress = p;
      masterTimeline.progress(p);
      renderScene(p);
      return { frame: frameIndex, total: total, progress: p };
    };

    window.seekToProgress = function(progress) {
      if (!masterTimeline.paused()) {
        masterTimeline.pause();
        document.getElementById('stage-container').classList.add('hide-controls');
      }
      const p = Math.max(0, Math.min(1, progress));
      animState.progress = p;
      masterTimeline.progress(p);
      renderScene(p);
      return p;
    };

    // Ready signal for automation
    window.__READY__ = true;

    // -------------------------------------------------------------
    // Interactive HUD & Preview Controls
    // -------------------------------------------------------------
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const scrubber = document.getElementById('scrubber');
    const timeInfo = document.getElementById('timeInfo');
    const frameInfo = document.getElementById('frameInfo');
    const themeBadge = document.getElementById('themeBadge');
    const textureBtn = document.getElementById('textureBtn');
    const guideToggle = document.getElementById('guideToggle');
    const armsToggle = document.getElementById('armsToggle');
    const themeButtons = document.querySelectorAll('[data-theme]');

    function updatePreviewHUD(p) {
      scrubber.value = p;
      const currentTime = (p * CONFIG.duration).toFixed(2);
      timeInfo.textContent = `${currentTime}s / ${CONFIG.duration}.00s`;
      const currentFrame = Math.floor(p * (CONFIG.totalFrames - 1));
      frameInfo.textContent = currentFrame;
    }

    playBtn.addEventListener('click', togglePlayback);

    function togglePlayback() {
      if (masterTimeline.paused()) {
        masterTimeline.play();
        playIcon.textContent = '⏸';
        playText.textContent = 'PAUSE';
      } else {
        masterTimeline.pause();
        playIcon.textContent = '▶';
        playText.textContent = 'PLAY';
      }
    }

    scrubber.addEventListener('input', (e) => {
      masterTimeline.pause();
      playIcon.textContent = '▶';
      playText.textContent = 'PLAY';
      const p = parseFloat(e.target.value);
      animState.progress = p;
      masterTimeline.progress(p);
      renderScene(p);
      updatePreviewHUD(p);
    });

    // Theme Switcher buttons
    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        themeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentThemeKey = btn.dataset.theme;
        themeBadge.textContent = `THEME: ${THEMES[currentThemeKey].name}`;
        playBtn.style.background = `linear-gradient(135deg, ${THEMES[currentThemeKey].hudAccent}, #22c55e)`;
        scrubber.style.accentColor = THEMES[currentThemeKey].hudAccent;
        renderScene(animState.progress);
      });
    });

    // Texture Intensity Switcher
    textureBtn.addEventListener('click', () => {
      if (textureLevel === 'HEAVY') textureLevel = 'MEDIUM';
      else if (textureLevel === 'MEDIUM') textureLevel = 'SUBTLE';
      else if (textureLevel === 'SUBTLE') textureLevel = 'OFF';
      else textureLevel = 'HEAVY';

      textureBtn.textContent = `Texture: ${textureLevel}`;
      textureBtn.classList.toggle('active', textureLevel !== 'OFF');
      renderScene(animState.progress);
    });

    // Arms count toggle
    armsToggle.addEventListener('click', () => {
      if (armsMode === '6+6') armsMode = '8+6';
      else if (armsMode === '8+6') armsMode = '8+8';
      else armsMode = '6+6';

      armsToggle.textContent = `Arms: ${armsMode}`;
      renderScene(animState.progress);
    });

    // Safe Area / Reel Guides Toggle
    guideToggle.addEventListener('click', () => {
      showGuideOverlay = !showGuideOverlay;
      guideToggle.textContent = `Guide: ${showGuideOverlay ? 'ON' : 'OFF'}`;
      guideToggle.classList.toggle('active', showGuideOverlay);
      renderScene(animState.progress);
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayback();
      } else if (e.code === 'ArrowRight') {
        masterTimeline.pause();
        playIcon.textContent = '▶';
        playText.textContent = 'PLAY';
        const nextP = Math.min(1, animState.progress + 1 / (CONFIG.totalFrames - 1));
        animState.progress = nextP;
        masterTimeline.progress(nextP);
        renderScene(nextP);
        updatePreviewHUD(nextP);
      } else if (e.code === 'ArrowLeft') {
        masterTimeline.pause();
        playIcon.textContent = '▶';
        playText.textContent = 'PLAY';
        const prevP = Math.max(0, animState.progress - 1 / (CONFIG.totalFrames - 1));
        animState.progress = prevP;
        masterTimeline.progress(prevP);
        renderScene(prevP);
        updatePreviewHUD(prevP);
      } else if (e.code === 'KeyH') {
        document.getElementById('stage-container').classList.toggle('hide-controls');
      }
    });

    // Initial render frame 0
    renderScene(0);
  </script>
</body>
</html>
