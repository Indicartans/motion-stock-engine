<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>Hypnotic Light Burst - Abstract Energy Rays & Color Flow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #020204;
      color: #f8fafc;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background: #020205;
    }

    canvas {
      display: block;
      width: 1920px;
      height: 1080px;
    }

    /* Preview controls overlay (Visible only in normal browser preview, auto-hidden in render mode) */
    #preview-controls {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(10, 8, 18, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 110, 220, 0.35);
      border-radius: 9999px;
      padding: 10px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 24px rgba(255, 60, 180, 0.2);
      z-index: 100;
      transition: opacity 0.3s ease;
    }

    .hide-controls #preview-controls {
      display: none !important;
    }

    .btn {
      background: linear-gradient(135deg, #ff3399, #ffaa00);
      color: #050208;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 9999px;
      padding: 7px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      box-shadow: 0 0 24px rgba(255, 110, 200, 0.8);
      transform: scale(1.04);
    }

    .slider {
      width: 300px;
      accent-color: #ff3399;
      cursor: pointer;
    }

    .telemetry {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      color: #fbcfe8;
      letter-spacing: 0.5px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      font-family: 'Consolas', monospace;
      color: #fed7aa;
      background: rgba(255, 170, 0, 0.14);
      border: 1px solid rgba(255, 170, 0, 0.4);
      padding: 3px 10px;
      border-radius: 9999px;
    }
  </style>

  <!-- Load GSAP locally with CDN fallback -->
  <script src="./node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    if (typeof gsap === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="motionCanvas" width="1920" height="1080"></canvas>
  </div>

  <!-- Interactive HUD for browser preview (hidden during automated render) -->
  <div id="preview-controls">
    <button id="playBtn" class="btn">
      <span id="playIcon">⏸</span> <span id="playText">PAUSE</span>
    </button>
    <input type="range" id="scrubber" class="slider" min="0" max="1" step="0.001" value="0">
    <div class="telemetry" id="timeInfo">0.00s / 8.00s</div>
    <div class="telemetry badge">FRAME: <span id="frameInfo">0</span> / 240</div>
    <div class="badge" style="color: #f472b6; border-color: rgba(244, 114, 182, 0.4); background: rgba(244, 114, 182, 0.12);">
      HYPNOTIC LIGHT BURST
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Configuration (Matching rules.md: 1080p, 30fps, 8s loop)
    // -------------------------------------------------------------
    const CONFIG = {
      width: 1920,
      height: 1080,
      duration: 8,        // 8 seconds (Within 5-10s specification)
      fps: 30,            // 30 FPS
      totalFrames: 240    // 8s * 30fps = 240 frames
    };

    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');
    const cx = CONFIG.width / 2;
    const cy = CONFIG.height / 2;

    // -------------------------------------------------------------
    // Procedural Energy Rays Model
    // -------------------------------------------------------------
    const NUM_RAYS = 72;
    const rayProfiles = [];
    for (let i = 0; i < NUM_RAYS; i++) {
      const baseTheta = (i / NUM_RAYS) * Math.PI * 2;
      rayProfiles.push({
        index: i,
        baseAngle: baseTheta,
        baseLen: 620 + (i % 7) * 45 + ((i * 13) % 90),
        width: 18 + (i % 5) * 8,
        speedFactor: 1, // 1x full rotation per 8s
        hueGroup: i % 4, // 0: Magenta/Pink, 1: Golden Amber, 2: Electric Cyan, 3: Deep Violet
        harmonicPhase: (i * 3) % 11
      });
    }

    // Secondary Fine Filament Rays (Counter-rotating)
    const NUM_FILAMENTS = 64;
    const filamentProfiles = [];
    for (let i = 0; i < NUM_FILAMENTS; i++) {
      filamentProfiles.push({
        baseAngle: (i / NUM_FILAMENTS) * Math.PI * 2,
        baseLen: 750 + ((i * 17) % 160),
        speedFactor: -1, // -1x counter rotation
        colorType: i % 3
      });
    }

    // Ambient Prismatic Light Dust Particles (Looping)
    const DUST_COUNT = 90;
    const dustParticles = [];
    for (let i = 0; i < DUST_COUNT; i++) {
      dustParticles.push({
        baseDist: 80 + Math.random() * 680,
        baseAngle: Math.random() * Math.PI * 2,
        size: 1.5 + Math.random() * 3.5,
        radialCycle: 1 + Math.floor(Math.random() * 2),
        orbitCycle: (Math.random() > 0.5 ? 1 : -1) * (1 + Math.floor(Math.random() * 2)),
        color: ['#ff3399', '#ffaa00', '#00f0ff', '#ffffff', '#c084fc'][Math.floor(Math.random() * 5)]
      });
    }

    // -------------------------------------------------------------
    // Main Render Routine (100% Deterministic Seamless Loop)
    // -------------------------------------------------------------
    function renderScene(progress) {
      const tau = Math.PI * 2;
      const angleProgress = progress * tau;

      // 1. Deep Velvet Dark Backdrop
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#020205';
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

      // 2. Ambient Deep Chromatic Vignette
      const bgGlow = ctx.createRadialGradient(cx, cy, 30, cx, cy, 850);
      const pulseBg = 0.5 + 0.5 * Math.sin(angleProgress * 2);
      bgGlow.addColorStop(0, `rgba(180, 20, 100, ${0.18 + 0.05 * pulseBg})`);
      bgGlow.addColorStop(0.35, `rgba(80, 10, 120, ${0.12 + 0.04 * pulseBg})`);
      bgGlow.addColorStop(0.7, 'rgba(15, 5, 25, 0.5)');
      bgGlow.addColorStop(1, 'rgba(2, 2, 5, 1)');
      ctx.fillStyle = bgGlow;
      ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

      // Switch to Additive Blending for Authentic Volumetric Light Burst
      ctx.globalCompositeOperation = 'lighter';

      // 3. Ambient Prismatic Optical Flow Rings (Blooming radial waves)
      drawOpticalBloomRings(angleProgress);

      // 4. Primary Hypnotic Energy Rays (Volumetric Light Beams)
      drawEnergyRays(angleProgress);

      // 5. Counter-Rotating Fine Prismatic Filaments
      drawPrismaticFilaments(angleProgress);

      // 6. Radiant Floating Light Dust & Prismatic Motes
      drawPrismaticDust(angleProgress);

      // 7. Blinding Central Plasma Iris & Anamorphic Starburst
      drawCentralLightBurst(angleProgress);

      // 8. Subtle Chromatic Edge Dispersion & Lens Flares
      drawLensFlares(angleProgress);

      // Reset composite operation for UI framing
      ctx.globalCompositeOperation = 'source-over';
    }

    // -------------------------------------------------------------
    // Optical Bloom Rings (Pulsing expanding waves)
    // -------------------------------------------------------------
    function drawOpticalBloomRings(angleProgress) {
      ctx.save();
      const numRings = 5;
      for (let r = 0; r < numRings; r++) {
        // Continuous wave loop from center outward
        const phase = (angleProgress * 2 + (r / numRings) * Math.PI * 2) % (Math.PI * 2);
        const norm = phase / (Math.PI * 2);
        const radius = 60 + norm * 520;
        const alpha = Math.sin(norm * Math.PI) * 0.16;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.lineWidth = 14 + norm * 26;
        
        if (r % 2 === 0) {
          ctx.strokeStyle = `rgba(255, 60, 160, ${alpha})`;
        } else {
          ctx.strokeStyle = `rgba(255, 170, 0, ${alpha * 0.8})`;
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // -------------------------------------------------------------
    // Volumetric Energy Rays (Core Hypnotic Light Burst)
    // -------------------------------------------------------------
    function drawEnergyRays(angleProgress) {
      ctx.save();
      ctx.translate(cx, cy);

      for (let i = 0; i < NUM_RAYS; i++) {
        const ray = rayProfiles[i];
        
        // Exact integer loop rotations
        // Main rotation: 1x full turn around center
        const currentAngle = ray.baseAngle + angleProgress * ray.speedFactor;
        
        // Harmonic undulating wave modulation for organic rhythm
        const wave = Math.sin(currentAngle * 4 + angleProgress * 2 + ray.harmonicPhase);
        const len = ray.baseLen + wave * 90;
        const spreadAngle = (ray.width / len) * (1 + 0.25 * Math.sin(angleProgress * 4 + i));

        // Coordinate endpoints of triangular/fan ray
        const theta1 = currentAngle - spreadAngle;
        const theta2 = currentAngle + spreadAngle;

        const x1 = Math.cos(theta1) * len;
        const y1 = Math.sin(theta1) * len;
        const x2 = Math.cos(theta2) * len;
        const y2 = Math.sin(theta2) * len;

        // Dynamic multi-stop radial gradient for rich color dispersion
        const grad = ctx.createRadialGradient(0, 0, 20, 0, 0, len);
        
        if (ray.hueGroup === 0) {
          // Vibrant Hot Pink / Magenta into Warm Amber
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
          grad.addColorStop(0.15, 'rgba(255, 50, 150, 0.65)');
          grad.addColorStop(0.5, 'rgba(255, 110, 60, 0.35)');
          grad.addColorStop(0.85, 'rgba(180, 0, 90, 0.15)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else if (ray.hueGroup === 1) {
          // Golden Amber / Neon Tangerine into Crimson
          grad.addColorStop(0, 'rgba(255, 255, 240, 0.9)');
          grad.addColorStop(0.2, 'rgba(255, 180, 20, 0.6)');
          grad.addColorStop(0.55, 'rgba(255, 80, 20, 0.3)');
          grad.addColorStop(0.85, 'rgba(140, 10, 50, 0.1)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else if (ray.hueGroup === 2) {
          // Electric Cyan / Turquoise into Deep Indigo
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
          grad.addColorStop(0.18, 'rgba(0, 240, 255, 0.55)');
          grad.addColorStop(0.5, 'rgba(99, 102, 241, 0.3)');
          grad.addColorStop(0.85, 'rgba(50, 0, 120, 0.12)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        } else {
          // Deep Violet / Ultraviolet into Magenta
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
          grad.addColorStop(0.2, 'rgba(192, 132, 252, 0.55)');
          grad.addColorStop(0.55, 'rgba(236, 72, 153, 0.3)');
          grad.addColorStop(0.85, 'rgba(80, 0, 100, 0.1)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    // -------------------------------------------------------------
    // Prismatic Fine Filaments (Counter-Rotating Hairline Rays)
    // -------------------------------------------------------------
    function drawPrismaticFilaments(angleProgress) {
      ctx.save();
      ctx.translate(cx, cy);

      for (let j = 0; j < NUM_FILAMENTS; j++) {
        const fil = filamentProfiles[j];
        // Counter rotation: -1x full cycle
        const curAngle = fil.baseAngle + angleProgress * fil.speedFactor;
        const wave = Math.sin(curAngle * 6 - angleProgress * 3);
        const len = fil.baseLen + wave * 70;

        const endX = Math.cos(curAngle) * len;
        const endY = Math.sin(curAngle) * len;

        ctx.lineWidth = 1.4;
        const grad = ctx.createLinearGradient(0, 0, endX, endY);
        if (fil.colorType === 0) {
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
          grad.addColorStop(0.4, 'rgba(255, 60, 180, 0.45)');
          grad.addColorStop(1, 'rgba(255, 60, 180, 0)');
        } else if (fil.colorType === 1) {
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
          grad.addColorStop(0.4, 'rgba(255, 200, 40, 0.4)');
          grad.addColorStop(1, 'rgba(255, 200, 40, 0)');
        } else {
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
          grad.addColorStop(0.4, 'rgba(0, 240, 255, 0.35)');
          grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
        }

        ctx.strokeStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }

      ctx.restore();
    }

    // -------------------------------------------------------------
    // Radiant Floating Light Dust & Prismatic Motes
    // -------------------------------------------------------------
    function drawPrismaticDust(angleProgress) {
      ctx.save();
      ctx.translate(cx, cy);

      for (let i = 0; i < DUST_COUNT; i++) {
        const d = dustParticles[i];
        
        // Exact integer loop orbits & radial oscillation
        const curAngle = d.baseAngle + angleProgress * d.orbitCycle;
        const curDist = d.baseDist + Math.sin(angleProgress * d.radialCycle * 2 + d.baseAngle) * 45;

        const px = Math.cos(curAngle) * curDist;
        const py = Math.sin(curAngle) * curDist;

        const pulse = 0.5 + 0.5 * Math.sin(angleProgress * 4 + i);
        const alpha = 0.3 + 0.5 * pulse;

        ctx.beginPath();
        ctx.arc(px, py, d.size * (0.8 + 0.4 * pulse), 0, Math.PI * 2);
        ctx.fillStyle = d.color;
        ctx.shadowColor = d.color;
        ctx.shadowBlur = 10;
        ctx.fill();
      }

      ctx.restore();
    }

    // -------------------------------------------------------------
    // Blinding Central Light Burst & Star Flare Core
    // -------------------------------------------------------------
    function drawCentralLightBurst(angleProgress) {
      ctx.save();
      const pulse = Math.sin(angleProgress * 4) * 0.5 + 0.5;

      // 1. Broad Radiant Aura Bloom
      const coreR = 120 + pulse * 28;
      const coreGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, coreR * 2.2);
      coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      coreGrad.addColorStop(0.15, 'rgba(255, 240, 160, 0.95)');
      coreGrad.addColorStop(0.35, 'rgba(255, 60, 150, 0.7)');
      coreGrad.addColorStop(0.65, 'rgba(168, 85, 247, 0.3)');
      coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR * 2.2, 0, Math.PI * 2);
      ctx.fill();

      // 2. Pure White Radiant Hot Core
      ctx.beginPath();
      ctx.arc(cx, cy, 32 + pulse * 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 40;
      ctx.fill();

      // 3. Multi-point Starburst Spikes
      const spikeCount = 12;
      const spikeRot = angleProgress * 0.5; // slow smooth rotation
      for (let s = 0; s < spikeCount; s++) {
        const theta = spikeRot + (s / spikeCount) * Math.PI * 2;
        const isMajor = s % 3 === 0;
        const len = isMajor ? 280 + pulse * 80 : 160 + pulse * 40;
        const w = isMajor ? 5 : 2.5;

        const x = cx + Math.cos(theta) * len;
        const y = cy + Math.sin(theta) * len;

        const grad = ctx.createLinearGradient(cx, cy, x, y);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, 'rgba(255, 140, 0, 0.8)');
        grad.addColorStop(1, 'rgba(255, 0, 128, 0)');

        ctx.strokeStyle = grad;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      ctx.restore();
    }

    // -------------------------------------------------------------
    // Horizontal Anamorphic Flare & Prismatic Rings
    // -------------------------------------------------------------
    function drawLensFlares(angleProgress) {
      ctx.save();
      const pulse = Math.sin(angleProgress * 2) * 0.5 + 0.5;

      // Horizontal Cinema Anamorphic Beam across full width
      const beamH = 5 + pulse * 3;
      const flareGrad = ctx.createLinearGradient(0, cy, CONFIG.width, cy);
      flareGrad.addColorStop(0, 'rgba(255, 50, 150, 0)');
      flareGrad.addColorStop(0.3, 'rgba(255, 100, 200, 0.25)');
      flareGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.95)');
      flareGrad.addColorStop(0.7, 'rgba(0, 220, 255, 0.25)');
      flareGrad.addColorStop(1, 'rgba(0, 220, 255, 0)');

      ctx.fillStyle = flareGrad;
      ctx.fillRect(0, cy - beamH / 2, CONFIG.width, beamH);

      // Thin Intense Core Line
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 380, cy - 1, 760, 2);

      // Chromatic Optical Flare Rings
      const ringRadii = [80, 170, 310, 480];
      ringRadii.forEach((r, idx) => {
        const ringPulse = Math.sin(angleProgress * 2 + idx) * 12;
        ctx.beginPath();
        ctx.arc(cx, cy, r + ringPulse, 0, Math.PI * 2);
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = idx % 2 === 0 ? 'rgba(255, 60, 180, 0.25)' : 'rgba(255, 170, 0, 0.2)';
        ctx.stroke();
      });

      ctx.restore();
    }

    // -------------------------------------------------------------
    // GSAP Timeline & Deterministic Engine Integration
    // -------------------------------------------------------------
    const animState = { progress: 0 };

    const masterTimeline = gsap.timeline({
      duration: CONFIG.duration,
      repeat: -1,
      paused: false,
      ease: 'none'
    });

    masterTimeline.to(animState, {
      progress: 1,
      duration: CONFIG.duration,
      ease: 'none',
      onUpdate: () => {
        renderScene(animState.progress);
        updatePreviewHUD(animState.progress);
      }
    });

    // -------------------------------------------------------------
    // Global Deterministic API for Playwright (render.mjs)
    // -------------------------------------------------------------
    window.renderFrame = function(frameIndex, totalFrames) {
      if (!masterTimeline.paused()) {
        masterTimeline.pause();
        document.body.classList.add('hide-controls');
      }
      const total = totalFrames || CONFIG.totalFrames;
      const p = Math.max(0, Math.min(1, frameIndex / (total - 1)));
      animState.progress = p;
      masterTimeline.progress(p);
      renderScene(p);
      return { frame: frameIndex, total: total, progress: p };
    };

    window.seekToProgress = function(progress) {
      if (!masterTimeline.paused()) {
        masterTimeline.pause();
        document.body.classList.add('hide-controls');
      }
      const p = Math.max(0, Math.min(1, progress));
      animState.progress = p;
      masterTimeline.progress(p);
      renderScene(p);
      return p;
    };

    // Flag ready for Playwright automation
    window.__READY__ = true;

    // -------------------------------------------------------------
    // Interactive Controls (Browser Preview Mode)
    // -------------------------------------------------------------
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const scrubber = document.getElementById('scrubber');
    const timeInfo = document.getElementById('timeInfo');
    const frameInfo = document.getElementById('frameInfo');

    function updatePreviewHUD(p) {
      scrubber.value = p;
      const currentTime = (p * CONFIG.duration).toFixed(2);
      timeInfo.textContent = `${currentTime}s / ${CONFIG.duration}.00s`;
      const currentFrame = Math.floor(p * (CONFIG.totalFrames - 1));
      frameInfo.textContent = currentFrame;
    }

    playBtn.addEventListener('click', () => {
      if (masterTimeline.paused()) {
        masterTimeline.play();
        playIcon.textContent = '⏸';
        playText.textContent = 'PAUSE';
      } else {
        masterTimeline.pause();
        playIcon.textContent = '▶';
        playText.textContent = 'PLAY';
      }
    });

    scrubber.addEventListener('input', (e) => {
      masterTimeline.pause();
      playIcon.textContent = '▶';
      playText.textContent = 'PLAY';
      const p = parseFloat(e.target.value);
      animState.progress = p;
      masterTimeline.progress(p);
      renderScene(p);
      updatePreviewHUD(p);
    });

    // Initial render frame 0
    renderScene(0);
  </script>
</body>
</html>
